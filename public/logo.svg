<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5ea" />
      <stop offset="30%" stop-color="#fcd34d" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="40%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Outer Glow Ring -->
  <circle cx="50" cy="50" r="44" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="2 6" opacity="0.4" />
  <circle cx="50" cy="50" r="41" stroke="url(#roseGrad)" stroke-width="0.75" opacity="0.3" />

  <!-- Crescent Moon -->
  <path
    d="M 50 14 C 69.88 14 86 30.12 86 50 C 86 69.88 69.88 86 50 86 C 41.5 86 33.6 83.05 27.4 78.1 C 41.2 75.8 51.8 64.1 51.8 50 C 51.8 35.9 41.2 24.2 27.4 21.9 C 33.6 16.95 41.5 14 50 14 Z"
    fill="url(#goldGrad)"
    filter="url(#glow)"
  />

  <!-- Intertwined Glowing Heart Inside Crescent -->
  <path
    d="M 46 41 C 43.5 37 38.5 36.5 35 39.5 C 31 43 31.5 48.5 35 52.5 L 46 63.5 L 57 52.5 C 60.5 48.5 61 43 57 39.5 C 53.5 36.5 48.5 37 46 41 Z"
    fill="url(#roseGrad)"
    filter="url(#glow)"
  />

  <!-- Celestial Diamond Sparkles -->
  <polygon points="78,24 80,30 86,32 80,34 78,40 76,34 70,32 76,30" fill="url(#goldGrad)" />
  <polygon points="22,64 23,68 27,69 23,70 22,74 21,70 17,69 21,68" fill="url(#roseGrad)" opacity="0.8" />
  <circle cx="50" cy="20" r="1.5" fill="#fff" opacity="0.9" />
  <circle cx="76" cy="68" r="1.2" fill="#fcd34d" opacity="0.7" />
</svg>
